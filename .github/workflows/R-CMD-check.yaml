# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples,
# with a longer timeout (building vendored ECL + Maxima from source is
# slow, more so on Windows) and a cache keyed on tools/versions.sh so only
# a version bump pays the full build cost again.
#
# windows-latest exercises configure.win, which is unverified against a
# real Windows build (see inst/NOTES.md) -- expect it to need iteration.
# r-lib's setup-r@v2 installs a matching Rtools automatically, so no
# separate Rtools step is needed.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Cache the vendored ECL/Maxima build
        uses: actions/cache@v4
        with:
          path: tools/build
          key: ${{ matrix.config.os }}-maxima-vendor-${{ hashFiles('tools/versions.sh') }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Default error-on is "warning", but this package has one
          # structural WARNING, not a bug: configure deliberately installs
          # libecl.so under inst/libs (colocated with this package's own
          # .so for the $ORIGIN rpath -- LGPL rules out a static link
          # instead), which trips "checking package subdirectories" since
          # inst/libs is also an R-reserved name. Relaxed to "error" so
          # that doesn't block CI; a genuinely new WARNING elsewhere won't
          # fail the build either until someone checks the output.
          error-on: '"error"'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
